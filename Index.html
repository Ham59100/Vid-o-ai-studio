<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video AI Studio - Netflix Style</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Thème par défaut : Netflix */
            --primary-color: #E50914;
            --bg-color: #141414;
            --surface-color: #1f1f1f;
            --text-color: #ffffff;
        }

        /* 8 Thèmes prédéfinis */
        [data-theme="netflix"] { --primary-color: #E50914; --bg-color: #141414; --surface-color: #1f1f1f; }
        [data-theme="pixar"] { --primary-color: #4A90E2; --bg-color: #1a1a2e; --surface-color: #16213e; }
        [data-theme="scifi"] { --primary-color: #00FFCC; --bg-color: #0d0d0d; --surface-color: #1a1a1a; }
        [data-theme="action"] { --primary-color: #FF4500; --bg-color: #1a0a0a; --surface-color: #2a1515; }
        [data-theme="drama"] { --primary-color: #8A2BE2; --bg-color: #0f0a1a; --surface-color: #1a1525; }
        [data-theme="dark"] { --primary-color: #555555; --bg-color: #000000; --surface-color: #111111; }
        [data-theme="gold"] { --primary-color: #FFD700; --bg-color: #121212; --surface-color: #222222; }
        [data-theme="cyberpunk"] { --primary-color: #FF00FF; --bg-color: #1a001a; --surface-color: #2a002a; }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: all 0.3s ease;
            min-height: 100vh;
            padding: 20px;
        }

        /* Header style Netflix */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #333;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--primary-color);
            font-size: 24px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .controls { display: flex; gap: 15px; align-items: center; }
        
        select {
            background: var(--surface-color);
            color: var(--text-color);
            border: 1px solid #444;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }

        /* Zone principale */
        .studio-container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--surface-color);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .form-group { margin-bottom: 20px; }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #ccc;
            font-size: 14px;
        }

        textarea {
            width: 100%;
            height: 200px;
            background: var(--bg-color);
            color: var(--text-color);
            border: 1px solid #444;
            padding: 15px;
            border-radius: 4px;
            font-size: 14px;
            resize: vertical;
        }

        .row {
            display: flex;
            gap: 20px;
        }
        
        .row .form-group { flex: 1; }

        /* Bouton style Netflix */
        button {
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s, opacity 0.2s;
        }

        button:hover { opacity: 0.9; transform: scale(1.02); }
        button:disabled { background-color: #555; cursor: not-allowed; transform: none; }

        /* Barre de progression */
        .progress-wrapper {
            margin-top: 30px;
            display: none;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            color: #ccc;
        }

        .progress-bar-container {
            width: 100%;
            height: 10px;
            background: #000;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--primary-color);
            transition: width 0.3s ease;
        }

        /* Découpage */
        .split-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .split-btn {
            background: transparent;
            border: 1px solid #444;
            color: #ccc;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            width: auto;
        }
        
        .split-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .card-preview {
            margin-top: 20px;
            padding: 15px;
            border-left: 4px solid var(--primary-color);
            background: rgba(0,0,0,0.3);
            font-size: 14px;
            display: none;
        }

    </style>
</head>
<body data-theme="netflix">

    <header>
        <h1>Video AI Studio</h1>
        <div class="controls">
            <select id="themeSelector" onchange="changeTheme(this.value)">
                <option value="netflix">Thème Netflix (Rouge)</option>
                <option value="pixar">Thème Pixar (Bleu)</option>
                <option value="scifi">Thème Sci-Fi (Cyan)</option>
                <option value="action">Thème Action (Orange)</option>
                <option value="drama">Thème Drame (Violet)</option>
                <option value="dark">Thème Sombre</option>
                <option value="gold">Thème Gold</option>
                <option value="cyberpunk">Thème Cyberpunk (Rose)</option>
            </select>
        </div>
    </header>

    <div class="studio-container">
        <div class="form-group">
            <label for="script">Script ou Prompt (jusqu'à 100 000 caractères)</label>
            <textarea id="script" placeholder="Décrivez votre film, votre série ou votre scène ici..."></textarea>
        </div>

        <div class="row">
            <div class="form-group">
                <label for="style">Style Visuel</label>
                <select id="style">
                    <option value="pixar">Pixar 3D</option>
                    <option value="scifi">Science-Fiction</option>
                    <option value="action">Action</option>
                    <option value="drama">Drame</option>
                </select>
            </div>
            <div class="form-group">
                <label for="platform">Format de sortie</label>
                <select id="platform">
                    <option value="tiktok">TikTok (Vertical)</option>
                    <option value="youtube">YouTube (Horizontal)</option>
                    <option value="instagram">Instagram Reels</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>Découpage des clips (Durée par segment)</label>
            <div class="split-options">
                <button class="split-btn active" onclick="setSplit(this, '8s')">8 sec</button>
                <button class="split-btn" onclick="setSplit(this, '10s')">10 sec</button>
                <button class="split-btn" onclick="setSplit(this, '20s')">20 sec</button>
                <button class="split-btn" onclick="setSplit(this, '1m')">1 min</button>
                <button class="split-btn" onclick="setSplit(this, '5m')">5 min</button>
                <button class="split-btn" onclick="setSplit(this, '45m')">45 min</button>
            </div>
        </div>

        <button id="generateBtn" onclick="startGeneration()">Générer la vidéo</button>

        <!-- Barre de progression -->
        <div class="progress-wrapper" id="progressWrapper">
            <div class="progress-info">
                <span id="statusText">Initialisation...</span>
                <span id="percentText">0%</span>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>

        <div class="card-preview" id="previewCard">
            <h3 style="color: var(--primary-color); margin-bottom: 10px;">Paramètres validés</h3>
            <p><strong>Longueur du script :</strong> <span id="prevScriptLength">0</span> caractères</p>
            <p><strong>Style :</strong> <span id="prevStyle">-</span></p>
            <p><strong>Plateforme :</strong> <span id="prevPlatform">-</span></p>
            <p><strong>Découpage :</strong> <span id="prevSplit">-</span></p>
            <br>
            <p style="color: #aaa; font-size: 12px;">Prêt à être envoyé au serveur Agnes AI et Ollama.</p>
        </div>
    </div>

    <script>
        let currentSplit = '8s';

        // Changer de thème
        function changeTheme(theme) {
            document.body.setAttribute('data-theme', theme);
        }

        // Changer l'option de découpage
        function setSplit(btn, value) {
            document.querySelectorAll('.split-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentSplit = value;
        }

        // Simulation de génération (pour tester l'interface)
        function startGeneration() {
            const script = document.getElementById('script').value;
            if (script.trim() === '') {
                alert("Veuillez entrer un script avant de générer.");
                return;
            }

            const style = document.getElementById('style').value;
            const platform = document.getElementById('platform').value;
            
            // Afficher les paramètres
            document.getElementById('prevScriptLength').innerText = script.length;
            document.getElementById('prevStyle').innerText = style;
            document.getElementById('prevPlatform').innerText = platform;
            document.getElementById('prevSplit').innerText = currentSplit;
            document.getElementById('previewCard').style.display = 'block';

            // Préparer l'UI de progression
            const btn = document.getElementById('generateBtn');
            const wrapper = document.getElementById('progressWrapper');
            const bar = document.getElementById('progressBar');
            const status = document.getElementById('statusText');
            const percentText = document.getElementById('percentText');

            btn.disabled = true;
            btn.innerText = "Génération en cours...";
            wrapper.style.display = 'block';
            
            let progress = 0;
            
            // Simulation d'une barre de progression
            const interval = setInterval(() => {
                // Vitesse aléatoire pour simuler le traitement
                progress += Math.random() * 5; 
                
                if (progress > 100) progress = 100;
                
                bar.style.width = progress + '%';
                percentText.innerText = Math.floor(progress) + '%';

                // Changer le texte de statut
                if (progress < 20) {
                    status.innerText = "Analyse du script par Ollama...";
                } else if (progress < 80) {
                    status.innerText = "Génération des clips via Agnes AI...";
                } else if (progress < 100) {
                    status.innerText = "Assemblage final...";
                } else {
                    status.innerText = "Terminé !";
                    clearInterval(interval);
                    btn.disabled = false;
                    btn.innerText = "Générer la vidéo";
                    alert("Simulation terminée ! (Le backend doit être connecté pour la vraie génération).");
                }
            }, 300);
        }
    </script>
</body>
</html>
